<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Пост</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f7f7f8;min-height:100vh;padding:32px 24px;color:#1a1a1a}
.container{max-width:780px;margin:0 auto}
.header{display:flex;justify-content:space-between;align-items:center;padding:16px 0;margin-bottom:32px;border-bottom:1px solid #eaeaea}
.header-left{display:flex;align-items:center;gap:12px}
.header-left .logo{font-size:20px;font-weight:600;color:#1a1a1a;text-decoration:none;letter-spacing:-.3px}
.header-left .logo span{color:#999}
.header-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{padding:6px 14px;background:none;border:1px solid #d0d0d0;border-radius:4px;font-size:13px;cursor:pointer;transition:all .2s;color:#555;text-decoration:none;display:inline-block;font-weight:450}
.btn:hover{border-color:#1a1a1a;color:#1a1a1a;background:#fafafa}
.btn-primary{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.btn-primary:hover{background:#000;border-color:#000;color:#fff}
.btn-danger{color:#c62828;border-color:#d0d0d0}
.btn-danger:hover{border-color:#c62828;color:#c62828}
.btn-summarize{color:#1565c0;border-color:#90caf9;background:#e3f2fd}
.btn-summarize:hover{border-color:#1565c0;background:#bbdefb;color:#0d47a1}
.btn-summarize:disabled{opacity:.6;cursor:not-allowed}
.user-badge{display:flex;align-items:center;gap:8px;font-size:13px;color:#757575;padding:4px 12px;background:#f0f0f0;border-radius:16px}
.user-badge .dot{width:6px;height:6px;border-radius:50%;background:#4caf50;display:inline-block}
.post-detail{background:#fff;padding:32px 36px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.04);margin-bottom:24px}
.post-title{font-size:26px;font-weight:600;color:#1a1a1a;margin-bottom:8px;line-height:1.3}
.post-meta{display:flex;gap:16px;font-size:14px;color:#757575;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #f0f0f0;flex-wrap:wrap}
.post-content{font-size:16px;line-height:1.7;color:#333;white-space:pre-wrap;word-break:break-word}
.summarize-section{margin-top:20px;padding-top:20px;border-top:1px solid #eaeaea}
.summarize-header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.summarize-header h4{font-size:15px;font-weight:600;color:#1a1a1a;margin:0}
.summarize-content{margin-top:12px;padding:16px 20px;background:#f5f7fa;border-radius:6px;border-left:3px solid #1565c0;font-size:15px;line-height:1.6;color:#1a1a1a;display:none}
.summarize-content.active{display:block}
.summarize-content .loading-dots{display:flex;align-items:center;gap:6px;padding:4px 0}
.summarize-content .loading-dots span{width:10px;height:10px;background:#1565c0;border-radius:50%;display:inline-block;animation:dotBounce 1.4s infinite ease-in-out both}
.summarize-content .loading-dots span:nth-child(1){animation-delay:-.32s}
.summarize-content .loading-dots span:nth-child(2){animation-delay:-.16s}
@keyframes dotBounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
.summarize-content .loading-text{color:#757575;font-size:14px;margin-left:10px}
.summary-text{white-space:pre-wrap;word-break:break-word;animation:fadeIn .5s ease}
.summary-error{color:#c62828;animation:fadeIn .5s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.comments-section{background:#fff;padding:24px 36px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.comments-section h3{font-size:18px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.comments-section h3 .count{font-weight:400;color:#757575;font-size:14px}
.comments-list{display:flex;flex-direction:column;gap:12px;margin-bottom:20px;max-height:400px;overflow-y:auto}
.comment-item{padding:12px 0;border-bottom:1px solid #f0f0f0}
.comment-item:last-child{border-bottom:none}
.comment-content{font-size:15px;color:#1a1a1a;line-height:1.5;word-break:break-word}
.comment-meta{font-size:12px;color:#999;margin-top:4px}
.comment-form{display:flex;gap:10px;margin-top:16px;padding-top:16px;border-top:1px solid #f0f0f0;flex-wrap:wrap}
.comment-form .input-group{flex:1;display:flex;gap:10px;min-width:200px}
.comment-form input[type="text"]{flex:1;padding:10px 14px;border:1px solid #d0d0d0;border-radius:4px;font-size:14px;font-family:inherit;background:#fafafa;min-width:100px}
.comment-form input[type="text"]:focus{outline:none;border-color:#1a1a1a;background:#fff}
.comment-form .btn{padding:10px 20px;flex-shrink:0}
.loading-state{text-align:center;padding:80px 20px;color:#999;font-size:14px}
.loading-state .spinner{display:inline-block;width:28px;height:28px;border:2px solid #e0e0e0;border-radius:50%;border-top-color:#1a1a1a;animation:spin .8s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
.message{padding:14px 20px;border-radius:4px;font-size:14px;line-height:1.5;margin-bottom:20px;display:none}
.message.error{display:block;background:#fbe9e7;color:#c62828;border-left:3px solid #c62828}
.message.success{display:block;background:#e8f5e9;color:#2e7d32;border-left:3px solid #2e7d32}
.message.info{display:block;background:#f0f0f0;color:#555;border-left:3px solid #999}
.hidden{display:none!important}
@media (max-width:640px){body{padding:16px 12px}.post-detail{padding:20px 16px}.post-title{font-size:20px}.comments-section{padding:16px}.comment-form{flex-direction:column}.comment-form .input-group{flex-direction:column;width:100%}.comment-form input[type="text"]{width:100%}.header{flex-wrap:wrap;gap:12px}.summarize-header{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<div class="container">
  <header class="header">
    <div class="header-left"><a href="posts.html" class="logo">blog<span>.</span></a></div>
    <div class="header-actions">
      <span class="user-badge" id="userBadge"><span class="dot" id="statusDot"></span><span id="userEmail">Загрузка...</span></span>
      <a href="posts.html" class="btn">← Назад</a>
      <button class="btn btn-danger" id="logoutBtn">Выйти</button>
    </div>
  </header>
  <div id="message" class="message"></div>
  <div id="postContainer">
    <div class="loading-state" id="loadingState"><div class="spinner"></div><div>Загрузка поста...</div></div>
    <div id="postContent" class="hidden">
      <div class="post-detail">
        <div class="post-title" id="postTitle"></div>
        <div class="post-meta">
          <span>✏️ <strong id="postAuthor">Автор</strong></span>
          <span>📅 <span id="postDate">—</span></span>
        </div>
        <div class="post-content" id="postBody"></div>
        <div class="summarize-section">
          <div class="summarize-header">
            <h4>📝 Выжимка текста</h4>
            <button class="btn btn-summarize" id="summarizeBtn">Получить выжимку</button>
          </div>
          <div class="summarize-content" id="summarizeContent">
            <div class="loading-dots"><span></span><span></span><span></span></div>
            <span class="loading-text">Генерация выжимки...</span>
          </div>
        </div>
      </div>
      <div class="comments-section" id="commentsSection">
        <h3>💬 Комментарии <span class="count" id="commentsCount">0</span></h3>
        <div class="comments-list" id="commentsList"></div>
        <div class="comment-form">
          <div class="input-group">
            <input type="text" id="commentInput" placeholder="Написать комментарий..." maxlength="500">
          </div>
          <button class="btn btn-primary" id="sendCommentBtn">Отправить</button>
        </div>
      </div>
    </div>
    <div class="empty-state hidden" id="emptyState"><h3>Пост не найден</h3><p>Возможно, он был удалён</p></div>
  </div>
</div>
<script>
const STORAGE_KEYS={ACCESS_TOKEN:'access_token',REFRESH_TOKEN:'refresh_token',USER_EMAIL:'user_email'};
const POSTS_KEY='mock_posts';
const params=new URLSearchParams(window.location.search);
const postId=Number(params.get('post'));

function isAuthenticated(){ return !!localStorage.getItem(STORAGE_KEYS.ACCESS_TOKEN); }
function getPosts(){ try{ return JSON.parse(localStorage.getItem(POSTS_KEY))||[]; }catch{ return []; } }
function setPosts(p){ localStorage.setItem(POSTS_KEY,JSON.stringify(p)); }
function getPost(){ return getPosts().find(p=>p.id===postId)||null; }

function showMessage(text,type='info'){
  const msg=document.getElementById('message');
  msg.textContent=text; msg.className=`message ${type}`;
  clearTimeout(window.messageTimeout);
  window.messageTimeout=setTimeout(()=>{msg.className='message';msg.textContent='';},5000);
}
function escapeHtml(text){
  if(!text) return '';
  const div=document.createElement('div'); div.textContent=text; return div.innerHTML;
}

function renderPost(){
  const post=getPost();
  const container=document.getElementById('postContent');
  const loading=document.getElementById('loadingState');
  const empty=document.getElementById('emptyState');
  loading.classList.add('hidden');
  if(!post){ empty.classList.remove('hidden'); return; }
  document.getElementById('postTitle').textContent=post.title||'Без названия';
  document.getElementById('postAuthor').textContent=post.author||'Автор';
  document.getElementById('postDate').textContent=post.created_at
    ? new Date(post.created_at).toLocaleDateString('ru-RU',{year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'})
    : 'Недавно';
  document.getElementById('postBody').textContent=post.content||'';
  renderComments(post.comments||[]);
  container.classList.remove('hidden');
}

function renderComments(comments){
  const list=document.getElementById('commentsList');
  const count=document.getElementById('commentsCount');
  if(!comments.length){
    list.innerHTML='<div style="padding:16px 0;color:#999;font-size:14px;text-align:center;">Пока нет комментариев. Будьте первым!</div>';
    count.textContent='0';
    return;
  }
  count.textContent=comments.length;
  list.innerHTML=comments.map(c=>`
    <div class="comment-item">
      <div class="comment-content">${escapeHtml(c.comment_content||'')}</div>
      <div class="comment-meta">${c.author?'👤 '+escapeHtml(c.author):''}${c.created_at?' · '+new Date(c.created_at).toLocaleString('ru-RU'):''}</div>
    </div>`).join('');
}

function sendComment(){
  const input=document.getElementById('commentInput');
  const text=input.value.trim();
  if(!text){ showMessage('Напишите сообщение','error'); return; }
  const posts=getPosts();
  const idx=posts.findIndex(p=>p.id===postId);
  if(idx===-1){ showMessage('Пост не найден','error'); return; }
  posts[idx].comments=posts[idx].comments||[];
  posts[idx].comments.push({
    author:localStorage.getItem(STORAGE_KEYS.USER_EMAIL)||'guest',
    comment_content:text,
    created_at:new Date().toISOString()
  });
  setPosts(posts);
  input.value='';
  renderComments(posts[idx].comments);
  showMessage('Комментарий добавлен','success');
}

function makeSummary(text){
  const clean=(text||'').replace(/\s+/g,' ').trim();
  if(!clean) return 'Текст пуст — нечего сокращать.';
  const sentences=clean.split(/(?<=[.!?])\s+/).filter(Boolean);
  const key=sentences.slice(0,2).join(' ');
  return `Выжимка (демо): ${key}${sentences.length>2?' …':''}\n\nСимволов: ${clean.length}, предложений: ${sentences.length}.`;
}

function summarize(){
  const btn=document.getElementById('summarizeBtn');
  const content=document.getElementById('summarizeContent');
  const post=getPost();
  if(!post) return;
  if(btn.disabled) return;
  btn.disabled=true; btn.textContent='⏳ Загрузка...';
  content.className='summarize-content active';
  content.innerHTML='<div class="loading-dots"><span></span><span></span><span></span></div><span class="loading-text">Генерация выжимки...</span>';
  setTimeout(()=>{
    try {
      const summary=makeSummary(post.content);
      content.innerHTML=`<div class="summary-text">${escapeHtml(summary)}</div>`;
      showMessage('✅ Выжимка получена','success');
    } catch(e){
      content.innerHTML='<div class="summary-error">❌ Ошибка генерации</div>';
    } finally {
      btn.disabled=false; btn.textContent='Получить выжимку';
    }
  },700);
}

document.getElementById('sendCommentBtn').addEventListener('click',sendComment);
document.getElementById('commentInput').addEventListener('keydown',(e)=>{
  if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendComment(); }
});
document.getElementById('summarizeBtn').addEventListener('click',summarize);
document.getElementById('logoutBtn').addEventListener('click',()=>{
  if(confirm('Выйти?')){
    Object.values(STORAGE_KEYS).forEach(k=>localStorage.removeItem(k));
    window.location.href='index.html';
  }
});

document.addEventListener('DOMContentLoaded',()=>{
  if(!isAuthenticated()){ window.location.href='index.html'; return; }
  document.getElementById('userEmail').textContent=localStorage.getItem(STORAGE_KEYS.USER_EMAIL)||'Пользователь';
  if(!postId){ window.location.href='posts.html'; return; }
  setTimeout(renderPost,300);
});
</script>
</body>
</html>
