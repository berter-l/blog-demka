<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Посты</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f7f7f8;min-height:100vh;padding:32px 24px;color:#1a1a1a}
.container{max-width:780px;margin:0 auto}
.header{display:flex;justify-content:space-between;align-items:center;padding:16px 0;margin-bottom:32px;border-bottom:1px solid #eaeaea}
.header-left{display:flex;align-items:center;gap:12px}
.header-left .logo{font-size:20px;font-weight:600;color:#1a1a1a;text-decoration:none;letter-spacing:-.3px}
.header-left .logo span{color:#999}
.header-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{padding:6px 14px;background:none;border:1px solid #d0d0d0;border-radius:4px;font-size:13px;cursor:pointer;transition:all .2s;color:#555;text-decoration:none;display:inline-block;font-weight:450}
.btn:hover{border-color:#1a1a1a;color:#1a1a1a;background:#fafafa}
.btn-primary{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.btn-primary:hover{background:#000;border-color:#000;color:#fff}
.btn-danger{color:#c62828;border-color:#d0d0d0}
.btn-danger:hover{border-color:#c62828;color:#c62828}
.user-badge{display:flex;align-items:center;gap:8px;font-size:13px;color:#757575;padding:4px 12px;background:#f0f0f0;border-radius:16px}
.user-badge .dot{width:6px;height:6px;border-radius:50%;background:#4caf50;display:inline-block}
.posts-list{display:flex;flex-direction:column;gap:16px}
.post-card{background:#fff;padding:24px 28px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.04);transition:all .2s;cursor:pointer;border:1px solid transparent}
.post-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.06);border-color:#eaeaea;transform:translateY(-1px)}
.post-title{font-size:18px;font-weight:600;color:#1a1a1a;margin-bottom:6px}
.post-author{font-size:14px;color:#757575}
.post-author strong{color:#333}
.post-meta{display:flex;gap:16px;margin-top:8px;font-size:13px;color:#999}
.empty-state{text-align:center;padding:80px 20px;background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.empty-state .icon{font-size:48px;margin-bottom:16px}
.empty-state h3{font-size:18px;color:#1a1a1a;margin-bottom:8px}
.empty-state p{color:#757575;font-size:14px}
.loading-state{text-align:center;padding:80px 20px;color:#999;font-size:14px}
.loading-state .spinner{display:inline-block;width:28px;height:28px;border:2px solid #e0e0e0;border-radius:50%;border-top-color:#1a1a1a;animation:spin .8s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
.message{padding:14px 20px;border-radius:4px;font-size:14px;line-height:1.5;margin-bottom:20px;display:none}
.message.error{display:block;background:#fbe9e7;color:#c62828;border-left:3px solid #c62828}
.message.success{display:block;background:#e8f5e9;color:#2e7d32;border-left:3px solid #2e7d32}
.message.info{display:block;background:#f0f0f0;color:#555;border-left:3px solid #999}
.hidden{display:none!important}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:1000;justify-content:center;align-items:center}
.modal-overlay.active{display:flex}
.modal{background:#fff;padding:32px 36px;border-radius:8px;max-width:500px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.modal h2{font-size:20px;font-weight:600;margin-bottom:20px}
.modal .form-group{margin-bottom:16px}
.modal .form-group label{display:block;font-size:14px;font-weight:500;margin-bottom:4px;color:#333}
.modal .form-group input,.modal .form-group textarea{width:100%;padding:10px 14px;border:1px solid #d0d0d0;border-radius:4px;font-size:14px;font-family:inherit}
.modal .form-group textarea{min-height:120px;resize:vertical}
.modal .form-group input:focus,.modal .form-group textarea:focus{outline:none;border-color:#1a1a1a}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
@media (max-width:640px){body{padding:16px 12px}.header{flex-wrap:wrap;gap:12px}.post-card{padding:16px 20px}.post-title{font-size:16px}.modal{padding:24px 20px}}
</style>
</head>
<body>
<div class="container">
  <header class="header">
    <div class="header-left"><a href="posts.html" class="logo">blog<span>.</span></a></div>
    <div class="header-actions">
      <span class="user-badge" id="userBadge"><span class="dot" id="statusDot"></span><span id="userEmail">Загрузка...</span></span>
      <button class="btn btn-primary" id="createPostBtn">+ Создать</button>
      <button class="btn btn-danger" id="logoutBtn">Выйти</button>
    </div>
  </header>
  <div id="message" class="message"></div>
  <div id="postsContainer">
    <div class="loading-state" id="loadingState"><div class="spinner"></div><div>Загрузка постов...</div></div>
    <div class="posts-list hidden" id="postsList"></div>
    <div class="empty-state hidden" id="emptyState"><div class="icon">📭</div><h3>Нет постов</h3><p>Создайте первый пост</p></div>
  </div>
</div>
<div class="modal-overlay" id="createModal">
  <div class="modal">
    <h2>✏️ Создать пост</h2>
    <form id="createPostForm">
      <div class="form-group"><label for="postTitle">Заголовок</label><input type="text" id="postTitle" placeholder="Введите заголовок"></div>
      <div class="form-group"><label for="postContent">Содержание</label><textarea id="postContent" placeholder="Введите содержание"></textarea></div>
      <div class="modal-actions">
        <button type="button" class="btn" onclick="closeModal()">Отмена</button>
        <button type="submit" class="btn btn-primary">Опубликовать</button>
      </div>
    </form>
  </div>
</div>
<script>
const STORAGE_KEYS={ACCESS_TOKEN:'access_token',REFRESH_TOKEN:'refresh_token',USER_EMAIL:'user_email'};
const POSTS_KEY='mock_posts';

function isAuthenticated(){ return !!localStorage.getItem(STORAGE_KEYS.ACCESS_TOKEN); }
function clearTokens(){ Object.values(STORAGE_KEYS).forEach(k=>localStorage.removeItem(k)); }

function getPosts(){
  try { return JSON.parse(localStorage.getItem(POSTS_KEY)) || []; } catch { return []; }
}
function setPosts(posts){ localStorage.setItem(POSTS_KEY, JSON.stringify(posts)); }

function seedPosts(){
  if(localStorage.getItem(POSTS_KEY)) return;
  const now=Date.now();
  const seeded=[
    {id:1,title:'Добро пожаловать в блог',content:'Это демо-пост без бэкенда. Все данные хранятся в localStorage вашего браузера.\n\nПопробуйте создать свой пост, оставить комментарий или получить выжимку — всё работает на клиенте.',author:'admin',created_at:new Date(now-86400000*3).toISOString(),comments:[{author:'guest',comment_content:'Отличный старт!',created_at:new Date(now-86400000*2).toISOString()}]},
    {id:2,title:'Как работает статический блог',content:'Страницы posts.html и post.html читают данные из localStorage.\n\nМаршрутизация поста — через параметр ?post=<id>. Это позволяет хостить проект на GitHub Pages без серверных роутов.',author:'admin',created_at:new Date(now-86400000).toISOString(),comments:[]}
  ];
  setPosts(seeded);
}

function updateUI(){
  const email=localStorage.getItem(STORAGE_KEYS.USER_EMAIL);
  document.getElementById('userEmail').textContent=isAuthenticated()?(email||'Пользователь'):'Гость';
}
function showMessage(text,type='info'){
  const msg=document.getElementById('message');
  msg.textContent=text; msg.className=`message ${type}`;
  clearTimeout(window.messageTimeout);
  window.messageTimeout=setTimeout(()=>{msg.className='message';msg.textContent='';},5000);
}
function escapeHtml(text){
  if(!text) return '';
  const div=document.createElement('div'); div.textContent=text; return div.innerHTML;
}

function renderPosts(){
  const list=document.getElementById('postsList');
  const loading=document.getElementById('loadingState');
  const empty=document.getElementById('emptyState');
  const posts=getPosts().slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  if(!posts.length){
    list.classList.add('hidden'); loading.classList.add('hidden'); empty.classList.remove('hidden'); return;
  }
  list.innerHTML=posts.map(p=>`
    <div class="post-card" onclick="openPost(${p.id})">
      <div class="post-title">${escapeHtml(p.title)}</div>
      <div class="post-author"><strong>${escapeHtml(p.author||'Автор')}</strong></div>
      <div class="post-meta"><span>📅 ${new Date(p.created_at).toLocaleDateString('ru-RU')}</span><span>💬 ${(p.comments||[]).length}</span></div>
    </div>`).join('');
  list.classList.remove('hidden'); loading.classList.add('hidden'); empty.classList.add('hidden');
}

function openPost(id){ window.location.href='post.html?post='+id; }

function openModal(){
  if(!isAuthenticated()){ showMessage('Войдите, чтобы создать пост','error'); return; }
  document.getElementById('createModal').classList.add('active');
  document.getElementById('postTitle').value='';
  document.getElementById('postContent').value='';
}
function closeModal(){ document.getElementById('createModal').classList.remove('active'); }

document.getElementById('createPostBtn').addEventListener('click',openModal);
document.getElementById('logoutBtn').addEventListener('click',()=>{
  if(confirm('Выйти?')){
    clearTokens();
    window.location.href='index.html';
  }
});
document.getElementById('createPostForm').addEventListener('submit',(e)=>{
  e.preventDefault();
  const title=document.getElementById('postTitle').value.trim();
  const content=document.getElementById('postContent').value.trim();
  if(!title||!content){ showMessage('Заполните все поля','error'); return; }
  const posts=getPosts();
  const nextId=posts.reduce((m,p)=>Math.max(m,p.id),0)+1;
  posts.push({
    id:nextId,title,content,
    author:localStorage.getItem(STORAGE_KEYS.USER_EMAIL)||'user',
    created_at:new Date().toISOString(),
    comments:[]
  });
  setPosts(posts);
  showMessage('✅ Пост создан!','success');
  closeModal();
  renderPosts();
});
document.getElementById('createModal').addEventListener('click',(e)=>{ if(e.target===e.currentTarget) closeModal(); });
document.addEventListener('keydown',(e)=>{ if(e.key==='Escape') closeModal(); });

document.addEventListener('DOMContentLoaded',()=>{
  if(!isAuthenticated()){ window.location.href='index.html'; return; }
  updateUI();
  seedPosts();
  setTimeout(renderPosts,300);
});
</script>
</body>
</html>
